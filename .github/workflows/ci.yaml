name: CI
on:
  push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - run: |
            npm init -y
            npm install jest
            npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - run: |
            docker build -t app1:1.0.0 .
            docker run -d --name app1 -p 3000:3000 app1:1.0.0
            
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000/health; then
                echo "App is healthy"
                exit 0
              fi
              echo "Waiting for app... ($i)"
              sleep 2
            done
            echo "Health check failed"
            docker logs app1
            exit 1